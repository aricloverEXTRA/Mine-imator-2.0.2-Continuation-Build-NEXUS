name: Build Mine-imator 2.0.2 NEXUS EXE

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 360   # Qt builds need a lot of time if cache misses

    env:
      DEV_DIR: "C:\\Dev"
      QT_VERSION: "5.15.9"
      QT_PREFIX: "C:\\Dev\\Qt\\5.15.9\\build"
      BUILD_DIR: "${{ github.workspace }}\\build"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install tools (Perl, CMake, Jom, NASM, etc.)
        run: |
          choco install strawberryperl cmake jom nasm -y --no-progress
          echo "C:\Strawberry\perl\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      - name: Setup OpenSSL
        run: |
          choco install openssl -y --no-progress
          # Adjust path if the choco package lands elsewhere
          echo "C:\Program Files\OpenSSL-Win64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      - name: Cache Qt static build
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: ${{ env.QT_PREFIX }}
          key: ${{ runner.os }}-qt-${{ env.QT_VERSION }}-static-v1

      # WARNING: This step is very slow and may still fail or timeout.
      # Prefer downloading a pre-built Qt prefix instead.
      - name: Build Qt 5.15.9 static (cache miss only)
        if: steps.cache-qt.outputs.cache-hit != 'true'
        run: |
          New-Item -ItemType Directory -Force -Path "C:\Dev\Qt\5.15.9" | Out-Null
          cd C:\Dev\Qt\5.15.9
          git clone https://github.com/qt/qt5.git --branch 5.15
          cd qt5
          perl init-repository --module-subset=qtbase,qtsvg,qttools  # expand as needed; match official skips
          # Use the EXACT long configure line from CppProject/BUILD.md (OpenSSL paths, -static -static-runtime, many -skip …)
          # Then: jom && jom install
          # (Full command omitted for length — copy from BUILD.md and adapt OpenSSL paths)
        shell: pwsh

      - name: Ensure External libs present
        run: |
          if (-not (Test-Path "CppProject\External\Win64")) {
            Write-Error "CppProject/External/Win64 is missing. Populate it from a known-good fork or build the static libs."
            exit 1
          }
        shell: pwsh

      - name: Run CppGen (GML → C++)
        run: |
          # Non-interactive; pipe "n" if the tool prompts about shaders
          "n" | dotnet run --project CppGen\CppGen\CppGen.csproj -- `
            GmProject `
            CppProject\Generated `
            CppProject\Asset\Sprites `
            CppProject\Asset\Shaders `
            CppGen\gml.json
        shell: pwsh

      - name: Configure CMake
        run: |
          # Bring in MSVC environment
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          cmd /c "`"$vsPath\VC\Auxiliary\Build\vcvarsall.bat`" x64 && set" | ForEach-Object {
            if ($_ -match "^(.*?)=(.*)$") { [System.Environment]::SetEnvironmentVariable($matches[1], $matches[2]) }
          }
          New-Item -ItemType Directory -Force -Path "${{ env.BUILD_DIR }}" | Out-Null
          cmake -S CppProject -B "${{ env.BUILD_DIR }}" `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_PREFIX_PATH="${{ env.QT_PREFIX }}"
        shell: pwsh

      - name: Copy datafiles
        run: |
          $dest = "${{ env.BUILD_DIR }}\Release"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -Recurse -Force GmProject\datafiles\* $dest
        shell: pwsh

      - name: Build Release
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          cmd /c "`"$vsPath\VC\Auxiliary\Build\vcvarsall.bat`" x64 && cmake --build `"${{ env.BUILD_DIR }}`" --config Release --parallel"
        shell: pwsh

      - name: Package (adapt to your script)
        run: |
          # Option A: if you have / can port make-release.ps1
          # powershell -ExecutionPolicy Bypass -File .\make-release.ps1 "2.0.2 Nexus 1.0.0" -BuildDir "${{ env.BUILD_DIR }}"

          # Option B: simple staging + zip (recommended starting point)
          $release = "${{ github.workspace }}\Release"
          New-Item -ItemType Directory -Force -Path $release | Out-Null
          Copy-Item "${{ env.BUILD_DIR }}\Release\Mine-imator.exe" $release -ErrorAction SilentlyContinue
          # also copy Data, Particles, create empty Projects/Schematics/Skins, etc.
          # then Compress-Archive ...
          Compress-Archive -Path "$release\*" -DestinationPath "Builds\Mine-imator-2.0.2-Nexus.zip" -Force
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mine-imator-2.0.2-Nexus-Release
          path: Builds\*.zip
          if-no-files-found: error
